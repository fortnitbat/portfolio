<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunter CS Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f4f4f9;
            color: #49035c;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            text-shadow: 3px 3px 0px #3fe0a2;
            margin-bottom: 10px;
        }
        .controls {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            background-color: #3fe0a2;
            color: #49035c;
            border: 4px solid #49035c;
            border-radius: 15px;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 0 #49035c;
            transition: all 0.1s ease;
        }
        button:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #49035c;
        }
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background-color: white;
            border: 4px solid #49035c;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 8px 8px 0px #ab804b;
            transition: transform 0.2s;
            animation: popIn 0.3s ease-out;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card h2 {
            margin-top: 0;
            color: #49035c;
        }
        .tag {
            background: #ab804b;
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 15px;
        }
        a.btn-link {
            display: block;
            background-color: #49035c;
            color: #3fe0a2;
            text-decoration: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            border: 3px solid #3fe0a2;
        }
        a.btn-link:hover {
            background-color: #3fe0a2;
            color: #49035c;
            border-color: #49035c;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>Hunter CS Portfolio</h1>
    <p>Welcome to my coding realm!</p>

    <div class="controls">
        <button onclick="filterWork('all')">All</button>
        <button onclick="filterWork('sims')">Sims</button>
        <button onclick="filterWork('sites')">Sites</button>
        <button onclick="filterWork('games')">Games</button>
        <button onclick="filterWork('other')">Other</button>
    </div>

    <div class="portfolio-grid" id="grid">
        <!-- Project 1 -->
        <div class="card" data-category="sims">
            <div class="tag">Simulation</div>
            <h2>My First Sim</h2>
            <p>A cool simulation project demonstrating physics and logic.</p>
            <a href="root-sim1.html" target="_blank" class="btn-link">Launch Project</a>
        </div>
    </div>

    <script>
        function playSound() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        }

        function filterWork(category) {
            playSound();
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    card.style.display = 'block';
                    card.style.animation = 'none';
                    card.offsetHeight; // trigger reflow
                    card.style.animation = 'popIn 0.3s ease-out';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
